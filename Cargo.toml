[workspace]
members = [
    "crates/skac",
    "crates/skald-compiler",
    "crates/skald-docs-check",
    "crates/skald-golden",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.82.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

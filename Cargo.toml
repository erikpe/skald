[workspace]
members = [
    "crates/skac",
    "crates/skald-binary64",
    "crates/skald-compiler",
    "crates/skald-docs-check",
    "crates/skald-golden",
    "crates/skald-mir-measure",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.82.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

# Golden tests compile hundreds of independent source programs. Keep the
# compiler's internal assertions and overflow checks while optimizing the host
# tools used by that workload.
[profile.golden]
inherits = "release"
incremental = true
debug-assertions = true
overflow-checks = true

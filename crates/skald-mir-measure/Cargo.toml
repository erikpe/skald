[package]
name = "skald-mir-measure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
skald-compiler = { path = "../skald-compiler" }
skald-golden = { path = "../skald-golden" }
# toml 1.1 requires Rust 1.85; keep the maintained 1.0 line for Rust 1.82.
toml = { version = "=1.0.7", default-features = false, features = ["parse", "serde", "std"] }


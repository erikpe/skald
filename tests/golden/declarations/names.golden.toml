schema = 2

[[test]]
name = "duplicate_declarations"
mode = "compile-fail"
source = "duplicate_declarations.ska"
[test.expect.stderr]
matches = [
  { name = "top-level function", match = "contains", inline = """error[RES001]: duplicate function `duplicate`
 --> tests/golden/declarations/duplicate_declarations.ska:5:4""" },
  { name = "local binding", match = "contains", inline = """error[RES002]: duplicate local binding `value`
 --> tests/golden/declarations/duplicate_declarations.ska:11:9""" },
]

[[test]]
name = "unknown_type"
mode = "compile-fail"
source = "unsupported_type.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[RES007]: unknown type `string`
 --> tests/golden/declarations/unsupported_type.ska:1:14"""

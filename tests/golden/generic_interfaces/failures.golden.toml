[[test]]
name = "unsatisfied_exact_bound"
mode = "compile-fail"
source = "bound_failure.ska"
compiler_args = ["--no-stdlib"]

[test.expect.stderr]
match = "exact"
inline = """error[RES048]: type argument for `Reader<Item>` does not satisfy `Source`'s bound
 --> tests/golden/generic_interfaces/bound_failure.ska:13:19
    |
13 | fn use(ref value: Reader<Item>) -> unit {}
    |                   ^^^^^^^^^^^^ the exact class argument does not provide effective nominal conformance to `Value<i64>`
   |
8 | where Source: Value<i64>
   |       ------------------ bound declared here
   |
1 | interface Value<T> {}
   |           ----- interface declared here
   |
7 | class Reader<Source>
   |       ------ template declared here
  = note: generic bounds accept exact classes with effective nominal conformance and primitives only through compiler-provided evidence for an exact canonical operator application or a supported exact canonical successor application
"""


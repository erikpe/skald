schema = 2

[[test]]
name = "exact_conformance"
mode = "compile-fail"
source = "exact_conformance_failure.ska"
compiler_args = ["--no-stdlib"]

[test.expect.stderr]
match = "exact"
inline = """error[TYP026]: method `value` does not exactly implement `Value<u64>.value`
 --> tests/golden/generic_interfaces/exact_conformance_failure.ska:8:8
   |
8 |     fn value() -> i64 {
   |        ^^^^^ result type differs from the interface requirement
   |
5 | class Wrong implements Value<u64> {
   |                        ---------- interface conformance declared here
   |
2 |     fn value() -> T;
   |        ----- requirement declared here
  = note: receiver access, binding modes, parameter types, and result type must match exactly
"""


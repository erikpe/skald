schema = 2

[[test]]
name = "execution"
mode = "run"
source = "function_calls.ska"
[[test.run]]
name = "direct_nested_unit_and_abi_calls"

[[test]]
name = "resolution_errors"
mode = "compile-fail"
source = "call_resolution_errors.ska"
[test.expect.stderr]
matches = [
  { name = "binding called as function", match = "contains", inline = """error[RES004]: binding `value` is not callable
 --> tests/golden/calls/call_resolution_errors.ska:11:12""" },
  { name = "unknown function", match = "contains", inline = """error[RES003]: unknown function or class `absent`
 --> tests/golden/calls/call_resolution_errors.ska:15:12""" },
]

[[test]]
name = "type_errors"
mode = "compile-fail"
source = "call_type_errors.ska"
[test.expect.stderr]
matches = [
  { name = "discarded value call", match = "contains", inline = """error[TYP008]: a call statement must call a function returning `unit`
 --> tests/golden/calls/call_type_errors.ska:12:5""" },
  { name = "missing return", match = "contains", inline = """error[TYP006]: function `missing_return` does not return a value
 --> tests/golden/calls/call_type_errors.ska:15:28""" },
  { name = "missing return expression", match = "contains", inline = """error[TYP007]: an `i64` function must return a value
 --> tests/golden/calls/call_type_errors.ska:20:5""" },
  { name = "unit call used as value", match = "contains", inline = """error[TYP005]: return value has type `unit` but `i64` is required
 --> tests/golden/calls/call_type_errors.ska:24:12""" },
  { name = "value returned from unit", match = "contains", inline = """error[TYP007]: function `value_return_from_unit` cannot return a value
 --> tests/golden/calls/call_type_errors.ska:28:5""" },
  { name = "wrong call arity", match = "contains", inline = """error[TYP004]: function `identity` expects 1 argument but received 0
 --> tests/golden/calls/call_type_errors.ska:32:12""" },
]

[[test]]
name = "invalid_external_parameter"
mode = "compile-fail"
source = "invalid_external_parameter.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR002]: expected the parameter type `i64`, `u64`, `u8`, `f64`, or `bool`, a named class type, or a shared object type
 --> tests/golden/calls/invalid_external_parameter.ska:1:23"""

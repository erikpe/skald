schema = 1

[[test]]
name = "break_loops"
mode = "run"
source = "break_loops.ska"
[[test.run]]
name = "nested_breaks"
expect = { exit = 0, stdout = { inline = "1\n2\n36\n30\n20\n10\n4\n50\n40\n6\n" } }

[[test]]
name = "continue_loops"
mode = "run"
source = "continue_loops.ska"
[[test.run]]
name = "nested_continues"
expect = { exit = 0, stdout = { file = "data/continue_loops.stdout" } }

[[test]]
name = "loop_lifecycle_matrix"
mode = "run"
source = "loop_lifecycle_matrix.ska"
[[test.run]]
name = "cleanup_order"
expect = { exit = 0, stdout = { file = "data/loop_lifecycle_matrix.stdout" } }

[[test]]
name = "while_loops"
mode = "run"
source = "while_loops.ska"
[[test.run]]
name = "loop_matrix"
expect = { exit = 0, stdout = { file = "data/while_loops.stdout" } }

[[test]]
name = "break_outside_loop"
mode = "compile-fail"
source = "break_outside_loop.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[RES035]: `break` requires an enclosing loop
 --> tests/golden/control_flow/break_outside_loop.ska:2:5"""

[[test]]
name = "continue_malformed"
mode = "compile-fail"
source = "continue_malformed.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR002]: expected `;` after the `continue` statement
 --> tests/golden/control_flow/continue_malformed.ska:4:5"""

[[test]]
name = "continue_outside_loop"
mode = "compile-fail"
source = "continue_outside_loop.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[RES035]: `continue` requires an enclosing loop
 --> tests/golden/control_flow/continue_outside_loop.ska:2:5"""

[[test]]
name = "while_condition_type"
mode = "compile-fail"
source = "while_condition_type.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP005]: while condition has type `i64` but `bool` is required
 --> tests/golden/control_flow/while_condition_type.ska:2:12"""

[[test]]
name = "while_malformed"
mode = "compile-fail"
source = "while_malformed.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR002]: expected `(` after `while`
 --> tests/golden/control_flow/while_malformed.ska:2:11"""

schema = 2

[[test]]
name = "break_loops"
mode = "run"
source = "break_loops.ska"
[[test.run]]
name = "nested_breaks"
expect = { stdout = { inline = "1\n2\n36\n30\n20\n10\n4\n50\n40\n6\n" } }

[[test]]
name = "continue_loops"
mode = "run"
source = "continue_loops.ska"
[[test.run]]
name = "nested_continues"
expect = { stdout = { file = "data/continue_loops.stdout" } }

[[test]]
name = "loop_lifecycle_matrix"
mode = "run"
source = "loop_lifecycle_matrix.ska"
[[test.run]]
name = "cleanup_order"
expect = { stdout = { file = "data/loop_lifecycle_matrix.stdout" } }

[[test]]
name = "while_loops"
mode = "run"
source = "while_loops.ska"
[[test.run]]
name = "loop_matrix"
expect = { stdout = { file = "data/while_loops.stdout" } }

[[test]]
name = "loop_placement_errors"
mode = "compile-fail"
source = "loop_placement_errors.ska"
[test.expect.stderr]
matches = [
  { name = "break outside loop", match = "contains", inline = """error[RES035]: `break` requires an enclosing loop
 --> tests/golden/control_flow/loop_placement_errors.ska:2:5""" },
  { name = "continue outside loop", match = "contains", inline = """error[RES035]: `continue` requires an enclosing loop
 --> tests/golden/control_flow/loop_placement_errors.ska:3:5""" },
]

[[test]]
name = "while_condition_type"
mode = "compile-fail"
source = "while_condition_type.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP005]: while condition has type `i64` but `bool` is required
 --> tests/golden/control_flow/while_condition_type.ska:2:12"""

[[test]]
name = "general_iteration"
mode = "run"
source = "general_iteration.ska"
[[test.run]]
name = "ordinary_iterable_loop_exits"
expect = { stdout = { inline = "1003\n100\n101\n102\n103\n3\n1005\n100\n101\n102\n103\n2\n1005\n100\n101\n102\n12\n1000\n100\n0\n" } }

[[test]]
name = "general_iteration_lifecycle"
mode = "run"
source = "general_iteration_lifecycle.ska"
[[test.run]]
name = "item_body_and_outer_cleanup"
expect = { stdout = { inline = "10\n11\n10\n30\n31\n30\n50\n51\n50\n70\n71\n70\n70\n" } }

[[test]]
name = "general_iteration_receivers"
mode = "run"
source = "general_iteration_receivers.ska"
[[test.run]]
name = "single_evaluation_and_retained_roots"
expect = { stdout = { inline = "900\n1\n1\n1\n1\n" } }

[[test]]
name = "general_iteration_value_matrix"
mode = "run"
source = "general_iteration_value_matrix.ska"
[[test.run]]
name = "stored_values_and_nested_optional_sentinel"
expect = { stdout = { inline = "10\n11\n20\n40\n40\n41\n61\n100\n100\n70\n70\n80\n81\n81\n91\n90\n" } }

[[test]]
name = "general_iteration_header_failures"
mode = "compile-fail"
source = "general_iteration_header_failures.ska"
[test.expect.stderr]
matches = [
  { name = "missing binding", match = "contains", inline = "error[PAR002]: expected an item binding after `for (`" },
  { name = "missing delimiter", match = "contains", inline = "error[PAR002]: expected contextual `in` after the item binding" },
  { name = "missing iterable", match = "contains", inline = "error[PAR004]: expected an iterable expression after `in`" },
]

[[test]]
name = "general_iteration_selection_failures"
mode = "compile-fail"
source = "general_iteration_selection_failures.ska"
[test.expect.stderr]
matches = [
  { name = "missing conformance", match = "contains", inline = "error[RES054]: the iterable type provides no eligible `std::iter::Iterable` application" },
  { name = "ambiguous conformance", match = "contains", inline = "error[RES055]: multiple eligible `std::iter::Iterable` applications remain" },
  { name = "annotation mismatch", match = "contains", inline = "error[RES056]: the iteration item annotation matches no eligible `Iterable` application" },
]

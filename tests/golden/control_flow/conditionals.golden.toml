name = "conditional_missing_block"
mode = "compile-fail"
source = "conditional_missing_block.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR002]: expected `{` to start a block
 --> tests/golden/control_flow/conditional_missing_block.ska:3:5"""


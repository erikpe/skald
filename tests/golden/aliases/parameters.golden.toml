mode = "compile-fail"
source = "alias_external.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP009]: external function `inspect` cannot declare alias parameters
 --> tests/golden/aliases/alias_external.ska:3:19"""


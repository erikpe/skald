schema = 2

[[test]]
name = "mixed_abi"
mode = "run"
source = "alias_mixed_abi.ska"
[[test.run]]
name = "register_and_stack_arguments"
expect = { stdout = { file = "data/alias_mixed_abi.stdout" } }

[[test]]
name = "parameters"
mode = "run"
source = "alias_parameters.ska"
[[test.run]]
name = "access_and_mutation"
expect = { stdout = { file = "data/alias_parameters.stdout" } }

[[test]]
name = "primitive_parameter"
mode = "run"
source = "primitive_alias_parameter.ska"
[[test.run]]
name = "return_value"

[[test]]
name = "produced_arguments"
mode = "run"
source = "produced_alias_arguments.ska"
[[test.run]]
name = "source_and_lifetime_matrix"
expect = { stdout = { file = "data/produced_alias_arguments.stdout" } }

[[test]]
name = "type_errors"
mode = "compile-fail"
source = "alias_type_errors.ska"
[test.expect.stderr]
matches = [
  { name = "read-only mutable forwarding", match = "contains", inline = """error[TYP021]: read-only access cannot satisfy a mutable alias parameter
 --> tests/golden/aliases/alias_type_errors.ska:17:12""" },
  { name = "object passed as scalar", match = "contains", inline = """error[TYP014]: an inline object cannot be used as an ordinary value
 --> tests/golden/aliases/alias_type_errors.ska:21:13""" },
  { name = "object returned as scalar", match = "contains", inline = """error[TYP014]: an inline object cannot be used as an ordinary value
 --> tests/golden/aliases/alias_type_errors.ska:23:12""" },
  { name = "read-only field mutation", match = "contains", inline = """error[TYP018]: cannot assign through a read-only receiver
 --> tests/golden/aliases/alias_type_errors.ska:27:13""" },
  { name = "read-only mutable method", match = "contains", inline = """error[TYP018]: mutable method `add` requires mutable receiver access
 --> tests/golden/aliases/alias_type_errors.ska:28:13""" },
  { name = "exact alias type", match = "contains", inline = """error[TYP005]: alias argument has type `Right`, expected `Left`
 --> tests/golden/aliases/alias_type_errors.ska:33:18""" },
  { name = "alias call arity", match = "contains", inline = """error[TYP004]: function `inspect_two` expects 2 arguments but received 1
 --> tests/golden/aliases/alias_type_errors.ska:35:5""" },
]

[[test]]
name = "external_parameter"
mode = "compile-fail"
source = "alias_external.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP009]: external function `inspect` cannot declare alias parameters
 --> tests/golden/aliases/alias_external.ska:3:19"""

[[test]]
name = "local_binding"
mode = "compile-fail"
source = "alias_local_binding.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR003]: local alias bindings are not supported
 --> tests/golden/aliases/alias_local_binding.ska:5:5"""

[[test]]
name = "malformed_modifiers"
mode = "compile-fail"
source = "alias_malformed_modifiers.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR002]: `mut` must precede `ref` in a mutable alias parameter
 --> tests/golden/aliases/alias_malformed_modifiers.ska:3:18"""

[[test]]
name = "produced_invalid_sources"
mode = "compile-fail"
source = "produced_alias_invalid_sources.ska"
[test.expect.stderr]
matches = [
  { name = "unrelated produced object", match = "contains", inline = """error[TYP005]: alias argument has type `Base`, expected `Other`
 --> tests/golden/aliases/produced_alias_invalid_sources.ska:14:15""" },
  { name = "produced object downcast", match = "contains", inline = """error[TYP005]: alias argument has type `Base`, expected `Derived`
 --> tests/golden/aliases/produced_alias_invalid_sources.ska:15:14""" },
  { name = "mutable produced object", match = "contains", inline = """error[TYP020]: mutable alias argument requires an existing object place
 --> tests/golden/aliases/produced_alias_invalid_sources.ska:16:12""" },
  { name = "produced primitive", match = "contains", inline = """error[TYP020]: primitive alias argument must designate an existing primitive place
 --> tests/golden/aliases/produced_alias_invalid_sources.ska:17:15""" },
  { name = "produced array", match = "contains", inline = """error[TYP020]: array alias argument must designate an existing array or exact element place
 --> tests/golden/aliases/produced_alias_invalid_sources.ska:18:11""" },
  { name = "produced optional", match = "contains", inline = """error[TYP020]: optional alias argument must designate an existing optional container
 --> tests/golden/aliases/produced_alias_invalid_sources.ska:19:14""" },
  { name = "implicit shared owner dereference", match = "contains", inline = """error[TYP034]: shared owner must be explicitly dereferenced for object-place use
 --> tests/golden/aliases/produced_alias_invalid_sources.ska:21:15""" },
]

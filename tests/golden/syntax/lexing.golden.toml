schema = 2

[[test]]
name = "invalid_lexemes"
mode = "compile-fail"
source = "invalid_lexemes.ska"
[test.expect.stderr]
matches = [
  { name = "invalid token", match = "contains", inline = """error[LEX001]: unexpected character `@`
 --> tests/golden/syntax/invalid_lexemes.ska:2:12""" },
  { name = "malformed string escape", match = "contains", inline = """error[LEX003]: unknown string escape
 --> tests/golden/syntax/invalid_lexemes.ska:6:12""" },
]

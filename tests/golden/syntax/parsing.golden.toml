schema = 1

[[test]]
name = "expected_declaration"
mode = "compile-fail"
source = "expected_declaration.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR001]: expected a top-level declaration
 --> tests/golden/syntax/expected_declaration.ska:1:1"""

[[test]]
name = "missing_semicolon"
mode = "compile-fail"
source = "missing_semicolon.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR002]: expected `;` after the return statement
 --> tests/golden/syntax/missing_semicolon.ska:3:1"""

[[test]]
name = "import_alias_path"
mode = "compile-fail"
source = "module_import_alias_path.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR011]: import aliases must be one identifier
 --> tests/golden/syntax/module_import_alias_path.ska:1:28"""

[[test]]
name = "import_trailing_comma"
mode = "compile-fail"
source = "module_import_trailing_comma.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR011]: selective imports do not allow a trailing comma
 --> tests/golden/syntax/module_import_trailing_comma.ska:1:29"""

[[test]]
name = "import_wildcard"
mode = "compile-fail"
source = "module_import_wildcard.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR011]: wildcard imports are not supported
 --> tests/golden/syntax/module_import_wildcard.ska:1:24"""

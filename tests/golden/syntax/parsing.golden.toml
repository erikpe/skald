schema = 2

[[test]]
name = "expected_declaration"
mode = "compile-fail"
source = "expected_declaration.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR001]: expected a top-level declaration
 --> tests/golden/syntax/expected_declaration.ska:1:1"""

[[test]]
name = "missing_semicolon"
mode = "compile-fail"
source = "missing_semicolon.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR002]: expected `;` after the return statement
 --> tests/golden/syntax/missing_semicolon.ska:3:1"""

[[test]]
name = "invalid_import_forms"
mode = "compile-fail"
compiler_args = [
  "--entry", "app",
  "--module-root", "cases/invalid_import_forms/modules",
  "--no-stdlib",
]
[test.expect.stderr]
matches = [
  { name = "alias path", match = "contains", inline = """error[PAR011]: import aliases must be one identifier
 --> modules/alias_path.ska:1:28""" },
  { name = "trailing comma", match = "contains", inline = """error[PAR011]: selective imports do not allow a trailing comma
 --> modules/trailing_comma.ska:1:29""" },
  { name = "wildcard", match = "contains", inline = """error[PAR011]: wildcard imports are not supported
 --> modules/wildcard.ska:1:24""" },
]

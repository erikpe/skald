schema = 1

[[test]]
name = "assertions"
mode = "run"
source = "std_test_assertions.ska"

[[test.run]]
name = "passing"
args = ["passing"]

[[test.run]]
name = "equality_failure"
args = ["equality-failure"]
expect = { exit = "failure", stderr = { inline = """panic: Assert failed: '-1' != '2'
stacktrace:
  at std::test::assert_eq_i64 (std/test.ska:10:9)
  at std_test_assertions::main (tests/golden/standard_test/std_test_assertions.ska:27:9)
""" } }

[[test.run]]
name = "explicit_failure"
args = ["explicit-failure"]
expect = { exit = "failure", stderr = { inline = """panic: Test failed: unexpected branch
stacktrace:
  at std::test::fail (std/test.ska:58:5)
  at std_test_assertions::main (tests/golden/standard_test/std_test_assertions.ska:30:5)
""" } }

schema = 1

[[test]]
name = "assertions"
mode = "run"
source = "std_test_assertions.ska"

[[test.run]]
name = "passing"
args = ["passing"]
expect = { exit = 0 }

[[test.run]]
name = "equality_failure"
args = ["equality-failure"]
expect = { exit = "failure", stderr = { match = "contains", inline = "Assert failed: '-1' != '2'" } }

[[test.run]]
name = "explicit_failure"
args = ["explicit-failure"]
expect = { exit = "failure", stderr = { match = "contains", inline = "Test failed: unexpected branch" } }

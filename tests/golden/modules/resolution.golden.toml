schema = 1

[[test]]
name = "composed_roots"
mode = "run"
compiler_args = [
  "--entry", "app::main",
  "--module-root", "cases/composed/application",
  "--module-root", "cases/composed/dependencies",
  "--no-stdlib",
]

[[test.run]]
name = "default"
expect = { exit = 84 }

[[test]]
name = "semantic_cycle"
mode = "run"
compiler_args = [
  "--entry", "app",
  "--module-root", "cases/cycle/modules",
  "--no-stdlib",
]

[[test.run]]
name = "default"
expect = { exit = 42 }

[[test]]
name = "positional_entry"
mode = "run"
source = "cases/positional_entry/entry/main.ska"
compiler_args = [
  "--module-root", "cases/positional_entry/modules",
  "--no-stdlib",
]

[[test.run]]
name = "default"
expect = { exit = 42 }

[[test]]
name = "alias_import_source"
mode = "compile-fail"
compiler_args = [
  "--entry", "app",
  "--module-root", "cases/alias_import_source/modules",
  "--no-stdlib",
]

[test.expect.stderr]
match = "starts-with"
inline = """error[MOD003]: module `Alias` was not found
 --> modules/app.ska:2:6"""


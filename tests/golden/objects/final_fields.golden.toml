schema = 2

[[test]]
name = "construction"
mode = "run"
source = "final_field_construction.ska"
[[test.run]]
name = "construction_copy_construction_and_read"
expect = { exit = 42 }

[[test]]
name = "assignment_lifecycle"
mode = "run"
source = "final_field_assignment_lifecycle.ska"
[[test.run]]
name = "user_effect_and_reverse_destruction"
expect = { stdout = { file = "data/final_field_assignment_lifecycle.stdout" } }

[[test]]
name = "assignment_failure"
mode = "run"
source = "final_field_assignment_failure.ska"
[[test.run]]
name = "user_assignment_preserves_failure"
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: integer division by zero\n" } }

[[test]]
name = "assignment"
mode = "run"
source = "final_field_assignment.ska"
[[test.run]]
name = "synthesized_user_nested_and_self_assignment"
expect = { exit = 42 }

[[test]]
name = "direct_write"
mode = "compile-fail"
source = "final_field_direct_write.ska"
[test.expect.stderr]
match = "contains"
inline = "error[TYP043]: final field `value` cannot be replaced"

[[test]]
name = "composition"
mode = "run"
source = "final_field_composition.ska"
compiler_args = ["--no-stdlib"]
[[test.run]]
name = "inheritance_checked_produced_dispatch_aliases_ownership_and_function_values"
expect = { exit = 42 }

[[test]]
name = "generic_modules"
mode = "run"
compiler_args = [
  "--entry", "app",
  "--module-root", "cases/final_field_generics",
  "--no-stdlib",
]
[[test.run]]
name = "substitutions_repeated_specialization_generic_bases_and_statics"
expect = { exit = 42 }

[[test]]
name = "alias_rebinding"
mode = "compile-fail"
source = "final_field_alias_rebinding.ska"
[test.expect.stderr]
matches = [
  { name = "optional field", match = "contains", inline = "read-only optional access cannot satisfy a mutable alias parameter" },
  { name = "static scalar", match = "contains", inline = "read-only primitive access cannot satisfy a mutable alias parameter" },
]

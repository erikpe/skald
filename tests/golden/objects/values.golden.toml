source = "explicit_copy_construction.ska"
[[test.run]]
name = "copy_and_cleanup"
expect = { stdout = { file = "data/explicit_copy_construction.stdout" } }

[[test]]
name = "copy"
mode = "run"
source = "object_value_copy.ska"
[[test.run]]
name = "copy_and_assignment"
expect = { stdout = { file = "data/object_value_copy.stdout" } }

[[test]]
name = "parameters"
mode = "run"
source = "object_value_parameters.ska"
[[test.run]]
name = "value_parameter_cleanup"
expect = { stdout = { file = "data/object_value_parameters.stdout" } }

[[test]]
name = "results"
mode = "run"
source = "object_value_results.ska"
[[test.run]]
name = "return_destination_and_cleanup"
expect = { stdout = { file = "data/object_value_results.stdout" } }

[[test]]
name = "temporaries"
mode = "run"
source = "object_value_temporaries.ska"
[[test.run]]
name = "full_expression_cleanup"
expect = { stdout = { file = "data/object_value_temporaries.stdout" } }

[[test]]
name = "explicit_copy_rejections"
mode = "compile-fail"
source = "explicit_copy_rejections.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP032]: copy-construction source can never provide the target class
 --> tests/golden/objects/explicit_copy_rejections.ska:13:27"""

[[test]]
name = "explicit_copy_nonclass"
mode = "compile-fail"
source = "explicit_copy_nonclass.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[RES011]: `copy` construction requires a concrete class
 --> tests/golden/objects/explicit_copy_nonclass.ska:11:20"""

[[test]]
name = "value_contexts"
mode = "compile-fail"
source = "object_value_contexts.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP015]: construction is not allowed in this expression context
 --> tests/golden/objects/object_value_contexts.ska:8:23"""

[[test]]
name = "external_parameter"
mode = "compile-fail"
source = "object_value_external_parameter.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP009]: external function `consume` has an unsupported signature
 --> tests/golden/objects/object_value_external_parameter.ska:5:1"""

[[test]]
name = "result_rejections"
mode = "compile-fail"
source = "object_value_result_rejections.ska"
[test.expect.stderr]
matches = [
  { name = "external object result", match = "contains", inline = """error[TYP009]: external function `external_result` has an unsupported signature
 --> tests/golden/objects/object_value_result_rejections.ska:25:1""" },
  { name = "unrelated object result", match = "contains", inline = """error[TYP014]: copy source and destination must have the same class or an ancestry relation
 --> tests/golden/objects/object_value_result_rejections.ska:14:12""" },
  { name = "missing object result", match = "contains", inline = """error[TYP007]: function `missing` must return an object
 --> tests/golden/objects/object_value_result_rejections.ska:18:5""" },
]

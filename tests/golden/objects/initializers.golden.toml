schema = 1

[[test]]
name = "base_overloads"
mode = "run"
source = "base_initializer_overloads.ska"
[[test.run]]
name = "base_selection"
expect = { stdout = { file = "data/base_initializer_overloads.stdout" } }

[[test]]
name = "overloads"
mode = "run"
source = "initializer_overloads.ska"
[[test.run]]
name = "selection_and_cleanup"
expect = { stdout = { file = "data/initializer_overloads.stdout" } }

[[test]]
name = "base_initialization_placement"
mode = "compile-fail"
source = "base_initialization_placement.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[RES016]: a derived initializer must begin with `super(...)`
 --> tests/golden/objects/base_initialization_placement.ska:9:9"""

[[test]]
name = "base_initialization_types"
mode = "compile-fail"
source = "base_initialization_types.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP030]: no initializer of base class `Base` matches these arguments
 --> tests/golden/objects/base_initialization_types.ska:9:9"""

[[test]]
name = "object_construction"
mode = "compile-fail"

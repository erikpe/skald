[[test]]
name = "optional_guard"
mode = "run"
source = "private_cell_optional_guard.ska"
[[test.run]]
name = "clear"
args = ["clear"]
expect = { exit = "failure", stderr = { inline = """panic: cannot mutate a guarded optional value
stacktrace:
  at private_cell_optional_guard::Holder.clear (tests/golden/objects/private_cell_optional_guard.ska:20:21)
  at private_cell_optional_guard::Holder.exercise_clear (tests/golden/objects/private_cell_optional_guard.ska:31:36)
  at private_cell_optional_guard::main (tests/golden/objects/private_cell_optional_guard.ska:47:16)
""" } }
[[test.run]]
name = "replace"
args = ["replace"]
expect = { exit = "failure", stderr = { inline = """panic: cannot mutate a guarded optional value
stacktrace:
  at private_cell_optional_guard::Holder.replace (tests/golden/objects/private_cell_optional_guard.ska:25:21)
  at private_cell_optional_guard::Holder.exercise_replace (tests/golden/objects/private_cell_optional_guard.ska:35:36)
  at private_cell_optional_guard::main (tests/golden/objects/private_cell_optional_guard.ska:49:12)
""" } }


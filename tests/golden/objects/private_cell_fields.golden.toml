[[test]]
name = "modifier_exclusions"
mode = "compile-fail"
source = "private_cell_modifier_exclusions.ska"
[test.expect.stderr]
matches = [
  { name = "public cell", match = "contains", inline = "cell fields must be private" },
  { name = "static cell", match = "contains", inline = "cell fields cannot be static" },
]

[[test]]
name = "privacy_exclusion"
mode = "compile-fail"
source = "private_cell_privacy_exclusion.ska"
[test.expect.stderr]
match = "contains"
inline = "member `value` is private to class `Base`"

[[test]]
name = "nested_access_exclusions"
mode = "compile-fail"
source = "private_cell_exclusions.ska"
[test.expect.stderr]
matches = [
  { name = "nested object mutation", match = "contains", inline = "cannot assign through a read-only receiver" },
  { name = "nested array mutation", match = "contains", inline = "cannot mutate a read-only array" },
]

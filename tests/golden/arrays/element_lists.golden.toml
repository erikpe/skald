[[test]]
name = "trailing_comma_rejection"
mode = "compile-fail"
source = "array_element_list_trailing_comma.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR004]: expected an array element after `,`
 --> tests/golden/arrays/array_element_list_trailing_comma.ska:2:23"""

[[test]]
name = "missing_comma_recovery"
mode = "compile-fail"
source = "array_element_list_missing_comma.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR002]: expected `,` between array elements
 --> tests/golden/arrays/array_element_list_missing_comma.ska:2:20"""

[[test]]
name = "inferred_list_rejection"

schema = 1

[[test]]
name = "operations"
mode = "run"
source = "array_views.ska"
[[test.run]]
name = "alias_replacement_and_slices"
expect = { stdout = { file = "data/array_views.stdout" } }

[[test]]
name = "access_exclusions"
mode = "compile-fail"
source = "array_access_exclusions.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP020]: an array alias root cannot be rebound
 --> tests/golden/arrays/array_access_exclusions.ska:2:5"""

[[test]]
name = "optional_payload"
mode = "compile-fail"
source = "array_optional_payload.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP043]: inline optional array payloads are not supported yet
 --> tests/golden/arrays/array_optional_payload.ska:1:21"""

[[test]]
name = "whole_pointee_assignment"
mode = "compile-fail"
source = "array_whole_pointee_assignment.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[RES020]: a complete shared pointee cannot be replaced
 --> tests/golden/arrays/array_whole_pointee_assignment.ska:3:5"""

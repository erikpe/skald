schema = 1

[[test]]
name = "aliases"
mode = "run"
source = "array_aliases.ska"
[[test.run]]
name = "replacement_and_element_identity"
expect = { exit = 0, stdout = { file = "data/array_aliases.stdout" } }

[[test]]
name = "slices"
mode = "run"
source = "array_slices.ska"
[[test.run]]
name = "copy_and_assignment"
expect = { exit = 0, stdout = { file = "data/array_slices.stdout" } }

[[test]]
name = "access_exclusions"
mode = "compile-fail"
source = "array_access_exclusions.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP020]: an array alias root cannot be rebound
 --> tests/golden/arrays/array_access_exclusions.ska:2:5"""

[[test]]
name = "optional_payload"
mode = "compile-fail"
source = "array_optional_payload.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR010]: inline optional array payloads are not supported
 --> tests/golden/arrays/array_optional_payload.ska:1:26"""

[[test]]
name = "whole_pointee_assignment"
mode = "compile-fail"
source = "array_whole_pointee_assignment.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[RES020]: a complete shared pointee cannot be replaced
 --> tests/golden/arrays/array_whole_pointee_assignment.ska:3:5"""

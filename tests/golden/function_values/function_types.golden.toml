schema = 2

[[test]]
name = "staged_semantic_gate"
mode = "compile-fail"
source = "function_types.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP044]: function values are not executable yet
 --> tests/golden/function_values/function_types.ska:3:22"""

[[test]]
name = "module_references"
mode = "compile-fail"
compiler_args = [
  "--entry", "app",
  "--module-root", "cases/supported",
  "--no-stdlib",
]
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP044]: function values are not executable yet
 --> supported/app.ska:5:37"""

[[test]]
name = "module_exclusions"
mode = "compile-fail"
compiler_args = [
  "--entry", "app",
  "--module-root", "cases/exclusions",
  "--no-stdlib",
]

[test.expect.stderr]
matches = [
  { name = "external", match = "contains", inline = """error[RES050]: external function `foreign` cannot be used as a function value
 --> exclusions/app.ska:4:33""" },
  { name = "instance", match = "contains", inline = """error[RES050]: instance method `read` cannot be used as a function value
 --> exclusions/app.ska:5:39""" },
  { name = "private static", match = "contains", inline = """error[RES031]: member `hidden` is private to class `Worker`
 --> exclusions/app.ska:6:49""" },
  { name = "raw template", match = "contains", inline = """error[RES039]: generic class `dep::Identity` requires type arguments
 --> exclusions/app.ska:7:31""" },
]

[[test]]
name = "generic_specialization"
mode = "compile-fail"
source = "generic_specialization.ska"

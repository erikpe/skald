schema = 2

[[test]]
name = "function_type_abi"
mode = "run"
source = "function_types.ska"
[[test.run]]
name = "internal_signature"
expect = { exit = 0 }

[[test]]
name = "module_references"
mode = "run"
compiler_args = [
  "--entry", "app",
  "--module-root", "cases/supported",
  "--no-stdlib",
]
[[test.run]]
name = "qualified_imported_and_static"
expect = { exit = 42 }

[[test]]
name = "module_exclusions"
mode = "compile-fail"
compiler_args = [
  "--entry", "app",
  "--module-root", "cases/exclusions",
  "--no-stdlib",
]

[test.expect.stderr]
matches = [
  { name = "external", match = "contains", inline = """error[RES050]: external function `foreign` cannot be used as a function value
 --> exclusions/app.ska:4:33""" },
  { name = "instance", match = "contains", inline = """error[RES050]: instance method `read` cannot be used as a function value
 --> exclusions/app.ska:5:39""" },
  { name = "private static", match = "contains", inline = """error[RES031]: member `hidden` is private to class `Worker`
 --> exclusions/app.ska:6:49""" },
  { name = "raw template", match = "contains", inline = """error[RES039]: generic class `dep::Identity` requires type arguments
 --> exclusions/app.ska:7:31""" },
]

[[test]]
name = "generic_specialization"
mode = "run"
source = "generic_specialization.ska"
compiler_args = ["--no-stdlib"]
[[test.run]]
name = "distinct_closed_targets"
expect = { exit = 42 }

[[test]]
name = "indirect_static_effect"
mode = "run"
source = "static_effects.ska"
compiler_args = ["--no-stdlib"]
[[test.run]]
name = "dependency_order"
expect = { exit = 42 }

[[test]]
name = "malformed_parameter_mode"
mode = "compile-fail"
source = "malformed_function_type.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[PAR002]: expected `ref` after `mut` in a function-type parameter
 --> tests/golden/function_values/malformed_function_type.ska:1:29"""

[[test]]
name = "indirect_call_diagnostics"
mode = "compile-fail"
source = "indirect_call_errors.ska"
compiler_args = ["--no-stdlib"]
[test.expect.stderr]
matches = [
  { name = "arity", match = "contains", inline = """error[TYP004]: function value expects 2 arguments but received 1
 --> tests/golden/function_values/indirect_call_errors.ska:4:28""" },
  { name = "type", match = "contains", inline = """error[TYP005]: call argument has type `bool` but `i64` is required
 --> tests/golden/function_values/indirect_call_errors.ska:5:36""" },
  { name = "alias mode", match = "contains", inline = """error[TYP021]: read-only access cannot satisfy a mutable alias parameter
 --> tests/golden/function_values/indirect_call_errors.ska:5:42""" },
]

[[test]]
name = "grouped_indirect_call"
mode = "compile-fail"
source = "grouped_indirect_call.ska"
compiler_args = ["--no-stdlib"]
[test.expect.stderr]
match = "starts-with"
inline = """error[RES004]: parenthesized function-value calls are not supported
 --> tests/golden/function_values/grouped_indirect_call.ska:2:13"""

[[test]]
name = "dereference_rejections"
mode = "compile-fail"
source = "explicit_shared_dereference_rejections.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[RES019]: dereference requires a shared owner
 --> tests/golden/shared_ownership/explicit_shared_dereference_rejections.ska:8:5"""

[[test]]
name = "implicit_member_access"
mode = "compile-fail"
source = "implicit_shared_member_access.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[RES021]: shared owner member access requires explicit dereference
 --> tests/golden/shared_ownership/implicit_shared_member_access.ska:29:5"""

[[test]]
name = "implicit_place_use"
mode = "compile-fail"
source = "implicit_shared_place_use.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP034]: shared owner must be explicitly dereferenced for object-place use
 --> tests/golden/shared_ownership/implicit_shared_place_use.ska:19:13"""

[[test]]

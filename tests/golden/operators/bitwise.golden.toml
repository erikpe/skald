schema = 2

[[test]]
name = "integer_bitwise_operators"
mode = "run"
source = "integer_bitwise_operators.ska"
[[test.run]]
name = "type_matrix"
expect = { stdout = { file = "data/integer_bitwise_operators.stdout" } }

[[test]]
name = "integer_shift_failures"
mode = "run"
source = "integer_shift_failures.ska"
[[test.run]]
name = "dynamic_count"
args = ["dynamic"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: shift count out of range" } }

[[test.run]]
name = "literal_count"
args = ["literal"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: shift count out of range" } }

[[test.run]]
name = "operand_before_count"
args = ["operand"]
expect = { exit = "failure", stdout = { inline = "1\n" }, stderr = { match = "starts-with", inline = "panic: optional value is absent" } }

[[test.run]]
name = "u8_count"
args = ["u8"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: shift count out of range" } }

[[test]]
name = "integer_shift_operators"
mode = "run"
source = "integer_shift_operators.ska"
[[test.run]]
name = "type_matrix"
expect = { stdout = { file = "data/integer_shift_operators.stdout" } }

[[test]]
name = "integer_bitwise_operator_types"
mode = "compile-fail"
source = "integer_bitwise_operator_types.ska"
[test.expect.stderr]
matches = [
  { name = "complement bool", match = "contains", inline = """error[TYP005]: bitwise complement requires a primitive integer operand
 --> tests/golden/operators/integer_bitwise_operator_types.ska:8:12""" },
  { name = "complement float", match = "contains", inline = """error[TYP005]: bitwise complement requires a primitive integer operand
 --> tests/golden/operators/integer_bitwise_operator_types.ska:12:12""" },

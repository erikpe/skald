schema = 1

[[test]]
name = "integer_bitwise_operators"
mode = "run"
source = "integer_bitwise_operators.ska"
[[test.run]]
name = "type_matrix"
expect = { exit = 91, stdout = { file = "data/integer_bitwise_operators.stdout" } }

[[test]]
name = "integer_shift_dynamic_count_out_of_range"
mode = "run"
source = "integer_shift_dynamic_count_out_of_range.ska"
[[test.run]]
name = "dynamic_count"
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: shift count out of range" } }

[[test]]
name = "integer_shift_literal_count_out_of_range"
mode = "run"
source = "integer_shift_literal_count_out_of_range.ska"
[[test.run]]
name = "literal_count"
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: shift count out of range" } }

[[test]]
name = "integer_shift_operand_failure"
mode = "run"
source = "integer_shift_operand_failure.ska"
[[test.run]]
name = "operand_before_count"
expect = { exit = "failure", stdout = { inline = "1\n" }, stderr = { match = "starts-with", inline = "panic: optional value is absent" } }

[[test]]
name = "integer_shift_operators"
mode = "run"
source = "integer_shift_operators.ska"
[[test.run]]
name = "type_matrix"
expect = { exit = 93, stdout = { file = "data/integer_shift_operators.stdout" } }

[[test]]
name = "integer_shift_u8_count_out_of_range"
mode = "run"
source = "integer_shift_u8_count_out_of_range.ska"
[[test.run]]
name = "u8_count"
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: shift count out of range" } }

[[test]]
name = "integer_bitwise_operator_types"
mode = "compile-fail"
source = "integer_bitwise_operator_types.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP005]: bitwise complement requires a primitive integer operand
 --> tests/golden/operators/integer_bitwise_operator_types.ska:8:12"""

[[test]]
name = "integer_shift_operator_types"
mode = "compile-fail"
source = "integer_shift_operator_types.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP005]: shift `<<` requires a primitive integer left operand and a `u64` count
 --> tests/golden/operators/integer_shift_operator_types.ska:10:7"""

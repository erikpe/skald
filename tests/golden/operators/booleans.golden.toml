 --> tests/golden/operators/short_circuit_boolean_operator_types.ska:24:18""" },
  { name = "shared right", match = "contains", inline = """error[TYP005]: logical operator `||` requires exact `bool` operands
 --> tests/golden/operators/short_circuit_boolean_operator_types.ska:28:18""" },
  { name = "object left", match = "contains", inline = """error[TYP005]: logical operator `||` requires exact `bool` operands
 --> tests/golden/operators/short_circuit_boolean_operator_types.ska:32:18""" },
  { name = "array right", match = "contains", inline = """error[TYP005]: logical operator `&&` requires exact `bool` operands

 --> tests/golden/operators/short_circuit_boolean_operator_types.ska:8:18""" },
  { name = "integer right", match = "contains", inline = """error[TYP005]: logical operator `||` requires exact `bool` operands
 --> tests/golden/operators/short_circuit_boolean_operator_types.ska:12:18""" },
  { name = "float left", match = "contains", inline = """error[TYP005]: logical operator `||` requires exact `bool` operands
 --> tests/golden/operators/short_circuit_boolean_operator_types.ska:16:18""" },
  { name = "optional right", match = "contains", inline = """error[TYP005]: logical operator `&&` requires exact `bool` operands
 --> tests/golden/operators/short_circuit_boolean_operator_types.ska:20:17""" },

schema = 2

[[test]]
name = "eager_boolean_operators"
mode = "run"
source = "eager_boolean_operators.ska"
[[test.run]]
name = "evaluation_order"
expect = { stdout = { file = "data/eager_boolean_operators.stdout" } }

[[test]]
name = "short_circuit_boolean_expressions"
mode = "run"
source = "short_circuit_boolean_expressions.ska"
[[test.run]]
name = "operator_matrix"
expect = { stdout = { file = "data/short_circuit_boolean_expressions.stdout" } }

[[test]]
name = "short_circuit_lifetimes"
mode = "run"
source = "short_circuit_lifetimes.ska"
[[test.run]]
name = "cleanup_order"
expect = { stdout = { file = "data/short_circuit_lifetimes.stdout" } }

[[test]]
name = "short_circuit_selected_failure"
mode = "run"
source = "short_circuit_selected_failure.ska"
[[test.run]]
name = "selected_operand"
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: optional value is absent" } }

[[test]]
name = "short_circuit_skipped_failures"
mode = "run"
source = "short_circuit_skipped_failures.ska"
[[test.run]]
name = "skipped_operands"
expect = { stdout = { file = "data/short_circuit_skipped_failures.stdout" } }

[[test]]
name = "eager_boolean_operator_types"
mode = "compile-fail"
source = "eager_boolean_operator_types.ska"
[test.expect.stderr]
matches = [
  { name = "negate integer", match = "contains", inline = """error[TYP005]: logical negation requires a `bool` operand
 --> tests/golden/operators/eager_boolean_operator_types.ska:8:12""" },
  { name = "negate float", match = "contains", inline = """error[TYP005]: logical negation requires a `bool` operand
 --> tests/golden/operators/eager_boolean_operator_types.ska:12:12""" },
  { name = "negate optional", match = "contains", inline = """error[TYP005]: logical negation requires a `bool` operand
 --> tests/golden/operators/eager_boolean_operator_types.ska:16:12""" },
  { name = "negate class", match = "contains", inline = """error[TYP005]: logical negation requires a `bool` operand
 --> tests/golden/operators/eager_boolean_operator_types.ska:20:12""" },
  { name = "negate shared", match = "contains", inline = """error[TYP005]: logical negation requires a `bool` operand
 --> tests/golden/operators/eager_boolean_operator_types.ska:24:12""" },
  { name = "negate object", match = "contains", inline = """error[TYP005]: logical negation requires a `bool` operand
 --> tests/golden/operators/eager_boolean_operator_types.ska:28:12""" },
  { name = "negate array", match = "contains", inline = """error[TYP005]: logical negation requires a `bool` operand
 --> tests/golden/operators/eager_boolean_operator_types.ska:32:12""" },
  { name = "negate unit", match = "contains", inline = """error[TYP005]: logical negation requires a `bool` operand
 --> tests/golden/operators/eager_boolean_operator_types.ska:36:12""" },
  { name = "mixed equality", match = "contains", inline = """error[TYP005]: binary `==` requires operands of the same supported primitive type

""" } }
[[test.run]]
name = "explicit_trace"
args = ["explicit"]
expect = { exit = "failure", stderr = { inline = """panic: operator failure
stacktrace:
  at operator_overloading_failures::Bomb.op_add (tests/golden/operators/operator_overloading_failures.ska:10:9)

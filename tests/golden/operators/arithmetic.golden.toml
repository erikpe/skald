schema = 2

[[test]]
name = "floating_division"
mode = "run"
source = "floating_division.ska"
[[test.run]]
name = "representative_values"
expect = { stdout = { file = "data/floating_division.stdout" } }

[[test]]
name = "integer_division_failures"
mode = "run"
source = "integer_division_failures.ska"
[[test.run]]
name = "division_by_zero"
args = ["division"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: integer division by zero" } }

[[test.run]]
name = "operand_before_operator"
args = ["operand"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: optional value is absent" } }

[[test.run]]
name = "remainder_by_zero"
args = ["remainder"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: integer remainder by zero" } }

[[test]]
name = "integer_division_operators"
mode = "run"
source = "integer_division_operators.ska"
[[test.run]]
name = "type_matrix"
expect = { stdout = { file = "data/integer_division_operators.stdout" } }

[[test]]
name = "primitive_operator_profile"
mode = "run"
source = "primitive_operator_profile.ska"
[[test.run]]
name = "operator_matrix"
expect = { stdout = { file = "data/primitive_operator_profile.stdout" } }

[[test]]
name = "integer_division_operator_types"
mode = "compile-fail"
source = "integer_division_operator_types.ska"
[test.expect.stderr]
matches = [
  { name = "mixed i64 and u64 division", match = "contains", inline = """error[TYP005]: binary `/` requires operands of the same numeric type
 --> tests/golden/operators/integer_division_operator_types.ska:12:7""" },
  { name = "mixed u64 and u8 remainder", match = "contains", inline = """error[TYP005]: integer `%` requires operands of the same primitive integer type
 --> tests/golden/operators/integer_division_operator_types.ska:13:8""" },
  { name = "boolean division", match = "contains", inline = """error[TYP005]: binary `/` requires operands of the same numeric type
 --> tests/golden/operators/integer_division_operator_types.ska:14:10""" },
  { name = "floating remainder", match = "contains", inline = """error[TYP005]: integer `%` requires operands of the same primitive integer type
 --> tests/golden/operators/integer_division_operator_types.ska:15:9""" },
  { name = "unit division", match = "contains", inline = """error[TYP005]: binary `/` requires operands of the same numeric type
 --> tests/golden/operators/integer_division_operator_types.ska:16:14""" },
  { name = "object remainder", match = "contains", inline = """error[TYP005]: integer `%` requires operands of the same primitive integer type
 --> tests/golden/operators/integer_division_operator_types.ska:17:13""" },
]

[[test]]
name = "integer_operation_types"
mode = "compile-fail"
source = "integer_operation_types.ska"
[test.expect.stderr]
matches = [
  { name = "mixed integer comparison", match = "contains", inline = """error[TYP005]: binary `<` requires operands of the same numeric type
 --> tests/golden/operators/integer_operation_types.ska:2:14""" },
  { name = "array primitive cast", match = "contains", inline = """error[TYP005]: primitive cast requires a primitive value source
 --> tests/golden/operators/integer_operation_types.ska:10:18""" },
  { name = "implicit integer conversion", match = "contains", inline = """error[TYP005]: return value has type `u64` but `i64` is required
 --> tests/golden/operators/integer_operation_types.ska:14:12""" },
]

schema = 1

[variant.omit-runtime-trace]
compiler_args = ["--omit-runtime-trace"]

[variant.optimization-none]
compiler_args = ["--mir-optimization", "none"]

[variant.reachability-disabled]
compiler_args = ["--disable-mir-pass", "whole-world-reachability"]

[variant.dead-pure-disabled]
compiler_args = ["--disable-mir-pass", "dead-pure-definition-elimination"]

[variant.constant-folding-disabled]
compiler_args = ["--disable-mir-pass", "primitive-constant-folding"]

[variant.algebraic-simplification-disabled]
compiler_args = ["--disable-mir-pass", "primitive-algebraic-simplification"]

[variant.cfg-cleanup-disabled]
compiler_args = ["--disable-mir-pass", "conservative-cfg-cleanup"]

[variant.checked-integer-folding-disabled]
compiler_args = ["--disable-mir-pass", "checked-integer-constant-folding"]

[variant.all-mir-passes-disabled]
compiler_args = [
  "--disable-mir-pass", "checked-integer-constant-folding",
  "--disable-mir-pass", "conservative-cfg-cleanup",
  "--disable-mir-pass", "dead-pure-definition-elimination",
  "--disable-mir-pass", "primitive-algebraic-simplification",
  "--disable-mir-pass", "primitive-constant-folding",
  "--disable-mir-pass", "whole-world-reachability",
]

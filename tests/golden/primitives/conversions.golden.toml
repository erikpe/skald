args = ["i64"]
expect = { exit = "failure", stdout = { file = "data/primitive_cast_i64_failure.stdout" }, stderr = { inline = """panic: floating-point cast out of range
stacktrace:
  at primitive_cast_failures::main (tests/golden/primitives/primitive_cast_failures.ska:38:16)
""" } }


[[test.run]]
name = "representative_values"
expect = { stdout = { file = "data/integer_casts.stdout" } }

[[test]]
name = "integer_string_range_guards"
mode = "run"
source = "integer_string_range_guards.ska"
[[test.run]]
name = "boundary_values"
expect = { stdout = { file = "data/integer_string_range_guards.stdout" } }

[[test]]
name = "primitive_cast_checked_success"
mode = "run"
source = "primitive_cast_checked_success.ska"
[[test.run]]
name = "boundary_values"
expect = { stdout = { file = "data/primitive_cast_checked_success.stdout" } }

[[test]]
name = "primitive_cast_failures"
mode = "run"
source = "primitive_cast_failures.ska"
[[test.run]]
name = "i64_before_later_effect"
args = ["i64"]
expect = { exit = "failure", stdout = { file = "data/primitive_cast_i64_failure.stdout" }, stderr = { inline = """panic: floating-point cast out of range
stacktrace:
  at primitive_cast_failures::main (tests/golden/primitives/primitive_cast_failures.ska:38:16)
""" } }

[[test.run]]
name = "u64_out_of_range"
args = ["u64"]
expect = { exit = "failure", stderr = { inline = """panic: floating-point cast out of range
stacktrace:
  at primitive_cast_failures::main (tests/golden/primitives/primitive_cast_failures.ska:41:29)
""" } }

[[test.run]]
name = "u8_out_of_range"
args = ["u8"]
expect = { exit = "failure", stderr = { inline = """panic: floating-point cast out of range
stacktrace:
  at primitive_cast_failures::main (tests/golden/primitives/primitive_cast_failures.ska:44:20)
""" } }

[[test]]
name = "primitive_cast_matrix"
mode = "run"

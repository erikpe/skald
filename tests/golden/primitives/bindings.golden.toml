schema = 2

[[test]]
name = "primitive_binding_reassignment"
mode = "run"
source = "primitive_binding_reassignment.ska"
[[test.run]]
name = "type_matrix"
expect = { stdout = { file = "data/primitive_binding_reassignment.stdout" } }

[[test]]
name = "primitive_type_errors"
mode = "compile-fail"
source = "primitive_type_errors.ska"
[test.expect.stderr]
matches = [
  { name = "boolean return", match = "contains", inline = """error[TYP005]: return value has type `i64` but `bool` is required
 --> tests/golden/primitives/primitive_type_errors.ska:2:12""" },
  { name = "i64 assignment", match = "contains", inline = """error[TYP005]: primitive binding assignment has type `u64` but `i64` is required
 --> tests/golden/primitives/primitive_type_errors.ska:12:14""" },
  { name = "u64 assignment", match = "contains", inline = """error[TYP005]: primitive binding assignment has type `u8` but `u64` is required
 --> tests/golden/primitives/primitive_type_errors.ska:13:16""" },
  { name = "u8 assignment", match = "contains", inline = """error[TYP005]: primitive binding assignment has type `i64` but `u8` is required
 --> tests/golden/primitives/primitive_type_errors.ska:14:12""" },
  { name = "f64 assignment", match = "contains", inline = """error[TYP005]: primitive binding assignment has type `bool` but `f64` is required
 --> tests/golden/primitives/primitive_type_errors.ska:15:13""" },
  { name = "bool assignment", match = "contains", inline = """error[TYP005]: primitive binding assignment has type `f64` but `bool` is required
 --> tests/golden/primitives/primitive_type_errors.ska:16:12""" },
  { name = "parameter assignment", match = "contains", inline = """error[TYP005]: primitive binding assignment has type `u64` but `i64` is required
 --> tests/golden/primitives/primitive_type_errors.ska:20:13""" },
]

[[test]]
name = "unknown_local"
mode = "compile-fail"
source = "unknown_local.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[RES003]: unknown name `absent`
 --> tests/golden/primitives/unknown_local.ska:2:12"""

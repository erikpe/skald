schema = 2

[[test]]
name = "byte_literals"
mode = "run"
source = "byte_literals.ska"
[[test.run]]
name = "representative_values"
expect = { stdout = { inline = "65\n10\n255\n65\n67\n39\ntrue\n" } }

[[test]]
name = "f64_values"
mode = "run"
source = "f64_values.ska"
[[test.run]]
name = "representative_values"
expect = { stdout = { file = "data/f64_values.stdout" } }

[[test]]
name = "hexadecimal_integer_literals"
mode = "run"
source = "hexadecimal_integer_literals.ska"
[[test.run]]
name = "representative_values"
expect = { stdout = { file = "data/hexadecimal_integer_literals.stdout" } }

[[test]]
name = "numeric_literals_out_of_range"
mode = "compile-fail"
source = "numeric_literals_out_of_range.ska"
[test.expect.stderr]
matches = [
  { name = "i64 literal", match = "contains", inline = """error[TYP003]: integer literal `9223372036854775808` is out of range for `i64`
 --> tests/golden/primitives/numeric_literals_out_of_range.ska:2:12""" },
  { name = "u64 literal", match = "contains", inline = """error[TYP010]: integer literal `18446744073709551616u` is out of range for `u64`
 --> tests/golden/primitives/numeric_literals_out_of_range.ska:6:12""" },
  { name = "u8 literal", match = "contains", inline = """error[TYP011]: integer literal `256u8` is out of range for `u8`
 --> tests/golden/primitives/numeric_literals_out_of_range.ska:10:12""" },
  { name = "f64 literal", match = "contains", inline = """error[TYP012]: floating literal `1.7976931348623159e308` is out of range for `f64`
 --> tests/golden/primitives/numeric_literals_out_of_range.ska:14:12""" },
]

[[test]]
name = "malformed_byte_literals"
mode = "compile-fail"
source = "malformed_byte_literals.ska"
[test.expect.stderr]
matches = [
  { name = "empty byte literal", match = "contains", inline = """error[LEX004]: empty byte literal
 --> tests/golden/primitives/malformed_byte_literals.ska:2:12""" },
  { name = "multiple byte literal", match = "contains", inline = """error[LEX004]: multiple bytes in byte literal
 --> tests/golden/primitives/malformed_byte_literals.ska:6:12""" },
  { name = "unknown byte escape", match = "contains", inline = """error[LEX004]: unknown byte escape
 --> tests/golden/primitives/malformed_byte_literals.ska:10:12""" },
  { name = "short hexadecimal byte escape", match = "contains", inline = """error[LEX004]: malformed hexadecimal byte escape
 --> tests/golden/primitives/malformed_byte_literals.ska:14:12""" },
  { name = "invalid hexadecimal byte escape", match = "contains", inline = """error[LEX004]: malformed hexadecimal byte escape
 --> tests/golden/primitives/malformed_byte_literals.ska:18:12""" },
  { name = "non-ASCII byte literal", match = "contains", inline = """error[LEX004]: non-ASCII content in byte literal
 --> tests/golden/primitives/malformed_byte_literals.ska:22:12""" },
  { name = "non-printable byte literal", match = "contains", inline = """error[LEX004]: non-printable byte in byte literal
 --> tests/golden/primitives/malformed_byte_literals.ska:26:12""" },
  { name = "unescaped newline in byte literal", match = "contains", inline = """error[LEX004]: unescaped newline in byte literal
 --> tests/golden/primitives/malformed_byte_literals.ska:30:12""" },
]

[[test]]
name = "malformed_hexadecimal_literals"
mode = "compile-fail"
source = "malformed_hexadecimal_literals.ska"
[test.expect.stderr]
matches = [
  { name = "hexadecimal missing digits", match = "contains", inline = """error[LEX002]: malformed numeric literal `0x`
 --> tests/golden/primitives/malformed_hexadecimal_literals.ska:2:12""" },
  { name = "hexadecimal invalid first digit", match = "contains", inline = """error[LEX002]: malformed numeric literal `0xg`
 --> tests/golden/primitives/malformed_hexadecimal_literals.ska:6:12""" },
  { name = "hexadecimal invalid later digit", match = "contains", inline = """error[LEX002]: malformed numeric literal `0x1g`
 --> tests/golden/primitives/malformed_hexadecimal_literals.ska:10:12""" },
  { name = "hexadecimal unsupported suffix", match = "contains", inline = """error[LEX002]: malformed numeric literal `0xffu64`
 --> tests/golden/primitives/malformed_hexadecimal_literals.ska:14:12""" },
  { name = "hexadecimal separator", match = "contains", inline = """error[LEX002]: malformed numeric literal `0x_ff`
 --> tests/golden/primitives/malformed_hexadecimal_literals.ska:18:12""" },
  { name = "hexadecimal decimal point", match = "contains", inline = """error[LEX002]: malformed numeric literal `0x1.0`
 --> tests/golden/primitives/malformed_hexadecimal_literals.ska:22:12""" },
  { name = "hexadecimal recovery", match = "contains", inline = """error[LEX002]: malformed numeric literal `0xnope`
 --> tests/golden/primitives/malformed_hexadecimal_literals.ska:26:26""" },
]

[[test]]
name = "malformed_integer"
mode = "compile-fail"
source = "malformed_integer.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[LEX002]: malformed numeric literal `12abc`
 --> tests/golden/primitives/malformed_integer.ska:2:12"""

[[test]]
name = "malformed_numeric_literals"
mode = "compile-fail"
source = "malformed_numeric_literals.ska"
[test.expect.stderr]
matches = [
  { name = "numeric unsupported suffix", match = "contains", inline = """error[LEX002]: malformed numeric literal `42u64`
 --> tests/golden/primitives/malformed_numeric_literals.ska:2:12""" },
  { name = "numeric missing fraction", match = "contains", inline = """error[LEX002]: malformed numeric literal `1.`
 --> tests/golden/primitives/malformed_numeric_literals.ska:6:12""" },
  { name = "numeric missing integer", match = "contains", inline = """error[LEX002]: malformed numeric literal `.5`
 --> tests/golden/primitives/malformed_numeric_literals.ska:10:12""" },
  { name = "numeric forbidden suffix", match = "contains", inline = """error[LEX002]: malformed numeric literal `1.0f64`
 --> tests/golden/primitives/malformed_numeric_literals.ska:14:12""" },
  { name = "numeric incomplete exponent", match = "contains", inline = """error[LEX002]: malformed numeric literal `1e+`
 --> tests/golden/primitives/malformed_numeric_literals.ska:18:12""" },
]

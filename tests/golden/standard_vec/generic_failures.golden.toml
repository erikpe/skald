schema = 2

[[test]]
name = "unsupported_element_types"
mode = "compile-fail"
source = "vec_generic_resolution_failures.ska"
[test.expect.stderr]
matches = [
  { name = "bare interface element", match = "contains", inline = "error[RES048]: type arguments for `std::vec::Vec<vec_generic_resolution_failures::Readable>` do not satisfy its requirements" },
  { name = "unavailable element lifecycle", match = "contains", inline = "error[RES048]: type arguments for `std::vec::Vec<vec_generic_resolution_failures::Node>` do not satisfy its requirements" },
  { name = "Obj element", match = "contains", inline = "error[RES048]: type arguments for `std::vec::Vec<Obj>` do not satisfy its requirements" },
]

[[test]]
name = "unit_element"
mode = "compile-fail"
source = "vec_generic_unit_failure.ska"
[test.expect.stderr]
match = "starts-with"
inline = "error[PAR002]: expected a generic type argument"

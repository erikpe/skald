[[test]]
name = "read_file_failures"
mode = "run"
source = "std_io_read_file_failures.ska"

[[test.run]]
name = "directory"
args = ["directory"]
cwd = { fixture = "read_files" }
expect = { exit = "failure", stderr = { match = "contains", inline = "io: failed to read file" } }

[[test.run]]
name = "embedded_zero"
args = ["embedded-zero"]
expect = { exit = "failure", stderr = { match = "contains", inline = "io: failed to open file" } }

[[test.run]]
name = "missing"
args = ["missing"]
expect = { exit = "failure", stderr = { match = "contains", inline = "io: failed to open file" } }

[[test]]
name = "read_stdin"
mode = "run"
source = "std_io_read_stdin.ska"

[[test.run]]
name = "empty"
stdin = { inline = "" }

[[test.run]]
name = "growth"
stdin = { file = "data/stdin-growth.bin" }
expect = { stdout = { file = "data/stdin-growth.bin" } }

[[test]]
name = "writes"
mode = "run"
source = "std_io_writes.ska"

[[test.run]]
name = "default"
expect = { stdout = { inline = "alphaomega\n" }, stderr = { inline = "betagamma\n" } }

[[test]]
name = "read_files"
mode = "run"
compiler_args = ["--entry", "app::main", "--module-root", "read_files/application"]

[[test.run]]
name = "temporary_paths"
args = ["{tmp:empty}", "{tmp:payload}"]
input_files = [
  { name = "empty", contents = { file = "data/empty.bin" } },
  { name = "payload", contents = { file = "data/file-payload.bin" } },
]
expect = { stdout = { file = "data/file-payload.bin" } }

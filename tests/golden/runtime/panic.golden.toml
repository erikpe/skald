schema = 1

[[test]]
name = "panic"
mode = "run"
source = "panic_cases.ska"

[[test.run]]
name = "dynamic_slice"
args = ["dynamic-slice"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: dynamic failure" } }

[[test.run]]
name = "empty"
args = ["empty"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: " } }

[[test.run]]
name = "literal"
args = ["literal"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: literal failure" } }

[[test]]
name = "expression"
mode = "compile-fail"
source = "panic_expression.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP041]: `std::error::panic` can only be used as a call statement
 --> tests/golden/runtime/panic_expression.ska:4:12"""

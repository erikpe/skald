schema = 1

[[test]]
name = "failures"
mode = "run"
source = "runtime_bounds_failures.ska"

[[test.run]]
name = "array_allocation_failure"
args = ["array-allocation-failure"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: memory allocation failed" } }

[[test.run]]
name = "array_allocation_overflow"
args = ["array-allocation-overflow"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: array allocation failed" } }

[[test.run]]
name = "array_index_empty_out_of_bounds"
args = ["array-index-empty"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: array index out of bounds" } }

[[test.run]]
name = "array_index_minimum_out_of_bounds"
args = ["array-index-minimum"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: array index out of bounds" } }

[[test.run]]
name = "array_index_negative_out_of_bounds"
args = ["array-index-negative"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: array index out of bounds" } }

[[test.run]]
name = "array_index_positive_out_of_bounds"
args = ["array-index-positive"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: array index out of bounds" } }

[[test.run]]
name = "array_maximum_length"
args = ["array-maximum-length"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: memory allocation failed" } }

[[test.run]]
name = "array_slice_invalid_bounds"
args = ["array-slice-invalid"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: array slice bounds are invalid" } }

[[test.run]]
name = "array_slice_length_mismatch"
args = ["array-slice-length-mismatch"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: array slice length mismatch" } }

[[test.run]]
name = "string_byte_out_of_bounds"
args = ["string-byte"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: array index out of bounds" } }

[[test.run]]
name = "string_slice_invalid_bounds"
args = ["string-slice"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: array index out of bounds" } }

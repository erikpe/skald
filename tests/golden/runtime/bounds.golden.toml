schema = 1

[[test]]
name = "failures"
mode = "run"
source = "runtime_bounds_failures.ska"

[[test.run]]
name = "array_allocation_failure"
args = ["array-allocation-failure"]
expect = { exit = "failure", stderr = { inline = """panic: memory allocation failed
stacktrace:
  at runtime_bounds_failures::array_allocation_failure (tests/golden/runtime/runtime_bounds_failures.ska:13:24)
  at runtime_bounds_failures::main (tests/golden/runtime/runtime_bounds_failures.ska:75:16)
""" } }


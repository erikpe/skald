schema = 1

[[test]]
name = "inline_lifecycle"
mode = "run"
source = "optional_inline_lifecycle.ska"
[[test.run]]
name = "presence_replacement_and_cleanup"
expect = { stdout = { file = "data/optional_inline_lifecycle.stdout" } }

[[test]]
name = "pinned_mutation"
mode = "run"
source = "optional_pinned_mutation.ska"
[[test.run]]
name = "clear"
args = ["clear"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: cannot mutate a guarded optional value" } }

[[test.run]]
name = "replace"
args = ["replace"]
expect = { exit = "failure", stderr = { match = "starts-with", inline = "panic: cannot mutate a guarded optional value" } }

[[test]]

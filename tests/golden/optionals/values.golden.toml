 --> tests/golden/optionals/optional_owner_alias_exclusions.ska:5:25""" },
  { name = "canonical optional-owner alias", match = "contains", inline = """error[TYP019]: function alias parameter `value` must name a primitive, class, array, interface, `Obj`, or supported inline optional
 --> tests/golden/optionals/optional_owner_alias_exclusions.ska:6:25""" },
]


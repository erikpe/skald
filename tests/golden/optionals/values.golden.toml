[[test]]
name = "malformed_punctuation"
mode = "compile-fail"
source = "optional_malformed_punctuation.ska"
[test.expect.stderr]
matches = [
  { name = "nested primitive optional", match = "contains", inline = """error[PAR010]: nested optional types are not supported
 --> tests/golden/optionals/optional_malformed_punctuation.ska:6:23""" },
  { name = "repeated shared optional marker", match = "contains", inline = """error[PAR002]: expected a class, interface, or `Obj` after `shared?`
 --> tests/golden/optionals/optional_malformed_punctuation.ska:7:23""" },
  { name = "optional cast target", match = "contains", inline = """error[PAR002]: expected `)` after the expression
 --> tests/golden/optionals/optional_malformed_punctuation.ska:10:30""" },
  { name = "punctuation after unwrap", match = "contains", inline = """error[PAR002]: expected `;` after the return statement
 --> tests/golden/optionals/optional_malformed_punctuation.ska:11:18""" },
]


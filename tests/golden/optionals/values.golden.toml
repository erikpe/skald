schema = 2

[[test]]
name = "absent_unwrap"
mode = "run"
source = "optional_absent_unwrap.ska"
[[test.run]]
name = "absent_value"
expect = { exit = "failure", stderr = { inline = """panic: optional value is absent
stacktrace:
  at optional_absent_unwrap::main (tests/golden/optionals/optional_absent_unwrap.ska:3:12)
""" } }

[[test]]
name = "primitive_operations"
mode = "run"
source = "optional_primitive_operations.ska"
[[test.run]]
name = "values_boundaries_and_aliases"

[[test]]
name = "alias_access"
mode = "compile-fail"
source = "optional_alias_access.ska"
[test.expect.stderr]
matches = [
  { name = "read-only container replacement", match = "contains", inline = """error[TYP018]: cannot replace a read-only optional container
 --> tests/golden/optionals/optional_alias_access.ska:6:5""" },
  { name = "read-only mutable alias", match = "contains", inline = """error[TYP021]: read-only optional access cannot satisfy a mutable alias parameter
 --> tests/golden/optionals/optional_alias_access.ska:12:21""" },
]

[[test]]
name = "containment_cycle"
mode = "compile-fail"
source = "optional_containment_cycle.ska"
[test.expect.stderr]
match = "starts-with"
inline = """error[TYP022]: recursive inline containment: `Recursive.next -> Recursive`
 --> tests/golden/optionals/optional_containment_cycle.ska:2:11"""

[[test]]
name = "conversion_exclusions"
mode = "compile-fail"
source = "optional_conversion_exclusions.ska"
[test.expect.stderr]
matches = [
  { name = "optional to plain", match = "contains", inline = """error[TYP005]: local initializer has type `i64?` but `i64` is required
 --> tests/golden/optionals/optional_conversion_exclusions.ska:3:29""" },
  { name = "different optional payload", match = "contains", inline = """error[TYP005]: primitive optional local initializer requires `bool?`
 --> tests/golden/optionals/optional_conversion_exclusions.ska:4:33""" },
  { name = "optional arithmetic", match = "contains", inline = """error[TYP005]: binary arithmetic requires operands of the same numeric type
 --> tests/golden/optionals/optional_conversion_exclusions.ska:5:28""" },
]

[[test]]
name = "declaration_exclusions"
mode = "compile-fail"
source = "optional_declaration_exclusions.ska"
[test.expect.stderr]
matches = [
  { name = "shared-owner alias", match = "contains", inline = """error[PAR010]: aliases to shared owners are not supported
 --> tests/golden/optionals/optional_declaration_exclusions.ska:5:28""" },
  { name = "uninitialized optional", match = "contains", inline = """error[PAR002]: expected `=` before the local initializer
 --> tests/golden/optionals/optional_declaration_exclusions.ska:8:28""" },
]

